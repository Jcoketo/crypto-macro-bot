<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Crypto Macro Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <h1>Crypto Macro Dashboard</h1>
    <p id="summary">Cargando datos...</p>

    <div class="charts">
      <canvas id="chartScore" height="120"></canvas>
      <canvas id="chartStable" height="120"></canvas>
    </div>

    <h3>Último registro</h3>
    <div id="last" class="card"></div>

    <h3>Interpretación (manual)</h3>
    <div id="interpretacion" class="card">
      <p>Escribe aquí tu interpretación manual del día.</p>
    </div>
  </div>

<script>
const SHEET_URL = "PEGA_AQUI_TU_SHEETBEST_URL"; // reemplazá por tu URL pública de sheet.best

async function fetchRows() {
  const r = await fetch(SHEET_URL);
  if (!r.ok) throw new Error("Error cargando datos: " + r.status);
  const data = await r.json();
  return data;
}

function renderLast(row){
  if(!row) return;
  const el = document.getElementById('last');
  el.innerHTML = `
    <table>
      <tr><td>Fecha</td><td>${row.fecha}</td></tr>
      <tr><td>Score macro</td><td>${row.score_macro}</td></tr>
      <tr><td>Weekly score</td><td>${row.weekly_score || "-"}</td></tr>
      <tr><td>Regimen</td><td>${row.regimen}</td></tr>
      <tr><td>Dominancia stable</td><td>${row.dominancia_stablecoins}%</td></tr>
      <tr><td>Variación 24h</td><td>${row.variacion_stablecoins_pct}%</td></tr>
      <tr><td>Aceleración</td><td>${row.aceleracion_stablecoins}%</td></tr>
      <tr><td>Dominancia BTC</td><td>${row.dominancia_bitcoin}%</td></tr>
    </table>
    <h4>Alerta</h4>
    <p>${row.alerta || "Sin alerta"}</p>
    <h4>Interpretación automática</h4>
    <p>${row.interpretacion}</p>
  `;
}

function renderCharts(rows){
  const labels = rows.map(r=> r.fecha.slice(0,10));
  const scores = rows.map(r=> Number(r.score_macro || 0));
  const weekly = rows.map(r=> Number(r.weekly_score || NaN));
  const stable = rows.map(r=> Number(r.dominancia_stablecoins || 0));

  // Score chart
  new Chart(document.getElementById('chartScore').getContext('2d'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Score Macro',
          data: scores,
          tension: 0.2,
          fill: false
        },
        {
          label: 'Weekly Score (suavizado)',
          data: weekly,
          tension: 0.2,
          fill: false
        }
      ]
    },
    options: {
      scales: { y: { beginAtZero: true, max: 100 } }
    }
  });

  // Stable dominance
  new Chart(document.getElementById('chartStable').getContext('2d'), {
    type: 'line',
    data: { labels, datasets: [{ label: 'Dominancia Stablecoins (%)', data: stable, tension:0.2 }] },
    options: { scales: { y: { beginAtZero:false } } }
  });
}

async function init(){
  try {
    const rows = await fetchRows();
    if(!rows || rows.length===0){
      document.getElementById('summary').innerText = "No hay datos aún.";
      return;
    }
    document.getElementById('summary').innerText = `Último: ${rows[rows.length-1].fecha} | Score: ${rows[rows.length-1].score_macro}`;
    renderLast(rows[rows.length-1]);
    renderCharts(rows.slice(-60)); // últimos 60 registros
  } catch(err){
    document.getElementById('summary').innerText = "Error cargando dashboard: " + err;
  }
}

init();
</script>
</body>
</html>
