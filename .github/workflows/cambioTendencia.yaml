name: CambioTendencias

on:
  schedule:
  - cron: "0 */4 * * *"
  workflow_dispatch:


jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ejecutar cambioTendencia.py
        env:
          SHEETBEST_URL: ${{ secrets.SHEETBEST_URL }}
          TENDENCIAS_TOKEN: ${{ secrets.TOKEN_TENDENCIAS }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cambioTendencias.py
